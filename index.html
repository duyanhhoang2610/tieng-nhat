<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minna no Nihongo - Học Tiếng Nhật N5 (Bài 1 - 6)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header Navbar -->
  <header>
    <div class="logo">
      <div class="logo-badge">日</div>
      <span>Minna no Nihongo</span>
    </div>
    <div id="userNav" class="user-nav"></div>
  </header>

  <!-- KHU VỰC ĐĂNG NHẬP / ĐĂNG KÝ / QUÊN MẬT KHẨU -->
  <section id="authSection">
    
    <!-- Form Đăng Nhập -->
    <div id="loginCard" class="auth-container">
      <div class="auth-header">
        <h2>Đăng Nhập</h2>
        <p>Tiếp tục hành trình học Tiếng Nhật</p>
      </div>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Tên đăng nhập</label>
          <input type="text" id="loginUser" value="demo" required>
        </div>
        <div class="form-group">
          <label>Mật khẩu</label>
          <input type="password" id="loginPass" value="123" required>
        </div>
        <button type="submit" class="btn-primary">Đăng Nhập</button>
      </form>
      <div class="auth-footer">
        <a href="#" onclick="switchAuthForm('forgot')">Quên mật khẩu?</a> | 
        <a href="#" onclick="switchAuthForm('register')">Đăng ký mới</a>
      </div>
    </div>

    <!-- Form Đăng Ký -->
    <div id="registerCard" class="auth-container" style="display: none;">
      <div class="auth-header">
        <h2>Đăng Ký Tài Khoản</h2>
        <p>Tạo tài khoản mới để trải nghiệm</p>
      </div>
      <form onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>Tên đăng nhập</label>
          <input type="text" id="regUser" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="regEmail" required>
        </div>
        <div class="form-group">
          <label>Mật khẩu</label>
          <input type="password" id="regPass" required>
        </div>
        <button type="submit" class="btn-primary">Tạo Tài Khoản & Reload</button>
      </form>
      <div class="auth-footer">
        Đã có tài khoản? <a href="#" onclick="switchAuthForm('login')">Đăng nhập</a>
      </div>
    </div>

    <!-- Form Quên Mật Khẩu -->
    <div id="forgotCard" class="auth-container" style="display: none;">
      <div class="auth-header">
        <h2>Khôi Phục Mật Khẩu</h2>
        <p>Nhập email để nhận mã xác nhận OTP</p>
      </div>
      <form onsubmit="sendOTP(event)">
        <div class="form-group">
          <label>Email đăng ký</label>
          <input type="email" id="forgotEmail" required>
        </div>
        <button type="submit" id="sendOtpBtn" class="btn-primary">Gửi Mã OTP</button>
      </form>

      <form id="otpStep" style="display: none; margin-top: 1rem;" onsubmit="verifyOTPAndReset(event)">
        <div class="form-group">
          <label>Nhập mã OTP</label>
          <input type="text" id="otpInput" placeholder="6 chữ số" required>
        </div>
        <div class="form-group">
          <label>Mật khẩu mới</label>
          <input type="password" id="newPassInput" required>
        </div>
        <button type="submit" class="btn-primary">Xác Nhận Đổi Mật Khẩu</button>
      </form>

      <div class="auth-footer">
        <a href="#" onclick="switchAuthForm('login')">Quay lại Đăng nhập</a>
      </div>
    </div>

  </section>

  <!-- KHU VỰC ỨNG DỤNG HỌC TẬP (Sau khi Đăng Nhập) -->
  <main id="appSection" class="app-container" style="display: none;">
    
    <!-- Thanh Chọn Bài Học -->
    <div class="lesson-selector">
      <button id="btn-lesson1" class="lesson-btn active" onclick="selectLesson('lesson1')">Bài 1</button>
      <button id="btn-lesson2" class="lesson-btn" onclick="selectLesson('lesson2')">Bài 2</button>
      <button id="btn-lesson3" class="lesson-btn" onclick="selectLesson('lesson3')">Bài 3</button>
      <button id="btn-lesson4" class="lesson-btn" onclick="selectLesson('lesson4')">Bài 4</button>
      <button id="btn-lesson5" class="lesson-btn" onclick="selectLesson('lesson5')">Bài 5</button>
      <button id="btn-lesson6" class="lesson-btn" onclick="selectLesson('lesson6')">Bài 6</button>
    </div>

    <!-- Thanh Chuyển Tính Năng (Tabs) -->
    <div class="tabs">
      <button id="tab-flashcard" class="tab-btn active" onclick="switchTab('flashcard')">🎴 Flashcard</button>
      <button id="tab-grammar" class="tab-btn" onclick="switchTab('grammar')">📖 Ngữ pháp</button>
      <button id="tab-dialogue" class="tab-btn" onclick="switchTab('dialogue')">💬 Hội thoại</button>
      <button id="tab-fill" class="tab-btn" onclick="switchTab('fill')">✏️ Bài tập Đục lỗ</button>
      <button id="tab-quiz" class="tab-btn" onclick="switchTab('quiz')">❓ Quiz</button>
    </div>

    <!-- Khu vực hiển thị Nội dung Dynamic -->
    <div id="tabContent"></div>

  </main>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js?v=3"></script>
  <script>
    // Chuyển đổi qua lại giữa các Form Auth
    function switchAuthForm(type) {
      document.getElementById('loginCard').style.display = type === 'login' ? 'block' : 'none';
      document.getElementById('registerCard').style.display = type === 'register' ? 'block' : 'none';
      document.getElementById('forgotCard').style.display = type === 'forgot' ? 'block' : 'none';
    }

    // Khởi tạo trạng thái ban đầu
    window.onload = () => {
      checkAuth();
      renderCurrentTab();
    };
  </script>
</body>
</html>
